<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
<title>Message sent | Philip Berry</title>
<meta name="description" content="Your message has been sent to Philip Berry Associates LLC.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="pb/img/favicon.svg">
<link rel="icon" href="vendor/img/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/css/line-awesome.min.css">
<style>
  :root{
    --pb-brand:#0E3B3E; --pb-accent:#B8873B; --pb-accent-2:#CFA157;
    --pb-ease:cubic-bezier(.22,.61,.36,1);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--pb-brand);
    font-family:'Montserrat',sans-serif; color:#fff;
    display:flex; align-items:center; justify-content:center; padding:30px;
    text-align:center;
  }
  .wrap{ max-width:560px; animation:rise .8s var(--pb-ease) both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(22px); } to{ opacity:1; transform:none; } }
  .tick{
    width:78px; height:78px; margin:0 auto 30px; border-radius:50%;
    border:2px solid var(--pb-accent); display:flex; align-items:center; justify-content:center;
  }
  .tick i{ font-size:38px; color:var(--pb-accent-2); }
  .eyebrow{
    color:var(--pb-accent-2); letter-spacing:.2em; text-transform:uppercase;
    font-size:12px; font-weight:600; margin:0 0 14px;
  }
  h1{ font-size:2.2rem; font-weight:300; margin:0 0 18px; line-height:1.25; }
  p{ color:rgba(255,255,255,.78); line-height:1.85; font-size:16px; margin:0 0 12px; }
  .links{ margin-top:36px; }
  a.btn{
    display:inline-block; padding:14px 30px; margin:0 6px 10px;
    font-size:12.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
    border-radius:2px; text-decoration:none; border:1px solid;
    transition:background .3s var(--pb-ease), color .3s var(--pb-ease),
               border-color .3s var(--pb-ease), transform .3s var(--pb-ease);
  }
  a.btn:hover{ transform:translateY(-2px); }
  .solid{ background:var(--pb-accent); border-color:var(--pb-accent); color:#fff; }
  .solid:hover{ background:#fff; border-color:#fff; color:var(--pb-brand); }
  .ghost{ background:transparent; border-color:rgba(255,255,255,.5); color:#fff; }
  .ghost:hover{ background:#fff; border-color:#fff; color:var(--pb-brand); }
  @media(max-width:575px){
    h1{ font-size:1.6rem; }
    a.btn{ display:block; max-width:290px; margin:0 auto 10px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tick"><i class="las la-check" aria-hidden="true"></i></div>
    <p class="eyebrow">Message sent</p>
    <h1>Thank you for getting in touch</h1>
    <p>Your message has reached Philip Berry Associates. You can expect a reply shortly.</p>
    <p>If it is urgent, call <a href="tel:+19172083428" style="color:var(--pb-accent-2)">917-208-3428</a>.</p>
    <div class="links">
      <a class="btn solid" href="./">Back to the site</a>
      <a class="btn ghost" href="https://www.linkedin.com/in/philip-berry-aaa5165/" target="_blank" rel="noopener noreferrer">Connect on LinkedIn</a>
    </div>
  </div>
</body>
</html>
